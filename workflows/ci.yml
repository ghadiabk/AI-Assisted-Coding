name: Task Tracker CI

on:
  push:
    branches: [ main, mid-course-project ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Enables manual "Run workflow" button in GitHub Actions UI

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "task-tracker/requirements.txt" ]; then
            pip install -r task-tracker/requirements.txt
          else
            echo "Error: requirements.txt not found!" && exit 1
          fi

      - name: Run Pytest suite
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v
          elif [ -d "task-tracker/tests" ]; then
            cd task-tracker && pytest tests/ -v
          else
            echo "Error: tests directory not found!" && exit 1
          fi